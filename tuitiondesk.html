<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuition Sir Classes</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F7F6;--card:#fff;--ink:#0F2E2C;--mute:#587270;--line:#D9E4E1;--dk:#0A3F3B;--brand:#0E6B63;--acc:#F2994A;--ok:#1E9E57;--okbg:#DDF5E7;--bad:#D33A3A;--badbg:#FBE1E1;--warn:#B7791F;--warnbg:#FFF1D0;--wa:#25D366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081B1A;--card:#102C2A;--ink:#E8F6F3;--mute:#9BBAB6;--line:#1D4440;--brand:#3FC2B3;--okbg:#12382A;--badbg:#431B22;--warnbg:#3F3213;--ok:#4BD58B;--bad:#FF7D7D;--warn:#F2C76A}}
:root[data-theme="dark"]{--bg:#081B1A;--card:#102C2A;--ink:#E8F6F3;--mute:#9BBAB6;--line:#1D4440;--brand:#3FC2B3;--okbg:#12382A;--badbg:#431B22;--warnbg:#3F3213;--ok:#4BD58B;--bad:#FF7D7D;--warn:#F2C76A}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0A3F3B;z-index:30}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0A3F3B;color:#fff}
.nb{display:flex;align-items:center;gap:16px;height:62px}
.logo{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.logo i{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#0A3F3B;display:grid;place-items:center;font-style:normal;font-weight:800}.logo b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;gap:20px;font-size:14px}.links a{text-decoration:none;opacity:.85}
.lg{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);padding:8px 14px;border-radius:99px;font-weight:600;font-size:13px}
@media(max-width:640px){.links{display:none}}
.hero{background:linear-gradient(160deg,#0A3F3B,#0E6B63);color:#fff;padding:56px 0}
.hg{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}@media(max-width:760px){.hg{grid-template-columns:1fr}}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.15;margin:0 0 14px;font-weight:800}.hero p{opacity:.9;max-width:520px;margin:0 0 22px}
.cta{display:inline-block;padding:13px 22px;border-radius:99px;font-weight:800;text-decoration:none;font-size:15px;margin:0 10px 10px 0}.cta.g{background:var(--acc);color:#0A3F3B}.cta.o{border:1px solid rgba(255,255,255,.5);color:#fff}
.hp{border-radius:24px;overflow:hidden;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);display:grid}.hp img{width:100%;height:100%;object-fit:cover;min-height:240px}
.st{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center}.st div{padding:34px 8px}.st b{font-size:30px;display:block}.st span{font-size:12px;opacity:.85}
section.s{padding:44px 0}h2.t{font-size:26px;margin:0 0 6px;font-weight:800}.sub{color:var(--mute);margin:0 0 22px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.card h4{margin:0 0 4px;font-size:16px}.card p{margin:0;color:var(--mute);font-size:14px}
.tcard{display:flex;gap:14px;align-items:center}.tav{width:72px;height:72px;border-radius:50%;background:var(--dk);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:22px;flex:none;overflow:hidden}.tav img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:700;margin-top:3px}
.f{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.btn{width:100%;padding:13px;border-radius:12px;font-weight:800;color:#fff;background:var(--brand);font-size:15px;margin-top:4px}.btn.wa{background:var(--wa);color:#06361A}.btn.ln{background:var(--card);color:var(--brand);border:1px solid var(--line)}.btn.rm{background:var(--badbg);color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.two{grid-template-columns:1fr}}
footer{background:#0A3F3B;color:#fff;padding:20px 0;font-size:13px;text-align:center}
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;display:none}.ov.on{display:flex}
#login{align-items:center;justify-content:center;padding:20px}.lbox{width:100%;max-width:340px}
#app{flex-direction:column}.col{width:100%;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.ah{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 8px;display:flex;justify-content:space-between;align-items:center}.ah b{font-size:18px;font-weight:800}
.ah button{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600}
main{flex:1;overflow-y:auto;padding:6px 16px 16px}
.hero2{background:linear-gradient(135deg,#0A3F3B,#0E6B63);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}.hero2 h1{margin:4px 0;font-size:34px;font-weight:800}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}.row.c{cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:14px}.grow small{color:var(--mute);font-size:12px}.amt{text-align:right;font-weight:800;font-size:14px}
.late{background:var(--badbg);color:var(--bad)}.soon{background:var(--warnbg);color:var(--warn)}.paid{background:var(--okbg);color:var(--ok)}
.mini{padding:8px 10px;border-radius:10px;background:var(--okbg);color:var(--ok);font-weight:700;font-size:12px}.mini.r{background:var(--badbg);color:var(--bad)}.mini.w{background:#DDF8E6;color:#06361A}.mini.n{background:var(--bg);color:var(--brand);border:1px solid var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}.acts .mini{flex:1;white-space:nowrap}
.pa{display:flex;gap:6px}.pa button{width:38px;height:34px;border-radius:10px;background:var(--bg);color:var(--mute);font-weight:800;border:1px solid var(--line)}
.pa .p.on{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.pa .a.on{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.grid .card{padding:12px}.grid b{font-size:20px;display:block}.grid small{color:var(--mute);font-size:11px}
.prog{height:8px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:10px}.prog i{display:block;height:100%;background:#fff;border-radius:9px}
h3{margin:14px 2px 8px;font-size:14px}.flt{display:flex;gap:8px;margin-bottom:10px}.flt .f{margin:0}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;color:var(--mute);font-size:10.5px;font-weight:600;padding:6px 0;position:relative}.tabs button.on{color:var(--brand)}.tabs svg{display:block;margin:0 auto 2px;width:22px;height:22px}
.tabs em{position:absolute;top:0;left:55%;background:var(--bad);color:#fff;font-style:normal;font-size:10px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center}
.sb{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}.sb.on{display:flex}#conf{z-index:70;align-items:center;padding:20px}
.sc{background:var(--card);width:100%;max-width:480px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:18px}#conf .sc{border-radius:20px;max-width:340px}
.fl{display:block;font-size:12px;color:var(--mute);margin:6px 0 3px}.pv{width:100%;height:150px;border-radius:14px;object-fit:cover;background:var(--dk);margin-bottom:8px}
#app,#sheet,#conf,#login{--bg:#EEF0F7;--card:#fff;--ink:#14173A;--mute:#6B7090;--line:#E3E6F2;--brand:#3B3FD8;--brand2:#1FA2E8;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) :is(#app,#sheet,#conf,#login){--bg:#0D0F24;--card:#181B3A;--ink:#EEF0FF;--mute:#9A9FC4;--line:#272B52;--brand:#7B8BFF}}
:root[data-theme="dark"] :is(#app,#sheet,#conf,#login){--bg:#0D0F24;--card:#181B3A;--ink:#EEF0FF;--mute:#9A9FC4;--line:#272B52;--brand:#7B8BFF}
#app .hero2{background:linear-gradient(135deg,var(--brand),var(--brand2))}
#app .row,#app .card{border-radius:14px}
.big{font-size:40px;font-weight:800;line-height:1}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin:22px 0 4px}.bars div{flex:1;background:linear-gradient(var(--brand2),var(--brand));border-radius:8px 8px 3px 3px;position:relative}.bars i{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;color:var(--mute)}
.lab{display:flex;gap:8px;font-size:11px;color:var(--mute)}.lab span{flex:1;text-align:center}
.hw{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px}
#app main,.sc{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:90}.toast.show{opacity:1}
</style>
</head>
<body>
<div id="site"></div>
<div class="ov" id="login"><div class="lbox card">
<h2 class="t" style="font-size:22px">Teacher login</h2><p class="sub" style="margin-bottom:14px">For teachers only.</p>
<input class="f" id="pin" type="password" inputmode="numeric" placeholder="Enter PIN" onkeydown="if(event.key==='Enter')doLogin()">
<div id="err" style="color:var(--bad);font-size:13px;min-height:20px"></div>
<button class="btn" onclick="doLogin()">Login</button>
<button class="btn ln" onclick="show('login',0)">Go back</button></div></div>
<div class="ov" id="app"><div class="col"><div class="ah"><b id="title"></b><div style="display:flex;gap:6px"><button onclick="show('app',0)">Public page</button><button onclick="logout()">Logout</button></div></div>
<main id="main"></main><div class="tabs" id="tabs"></div></div></div>
<div class="sb" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sc" id="sc"></div></div>
<div class="sb" id="conf"><div class="sc" id="cc"></div></div>
<div class="toast" id="toast"></div>
<script>
const PIN="1234",$=id=>$$(id),$$=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini=n=>n.split(" ").filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?";
const col=id=>["#7B5CF0","#F0773C","#1FA2C8","#E0529C","#2BA86B"][id%5],inr=n=>"₹"+Number(n).toLocaleString("en-IN");
const CL=["Class 8","Class 9","Class 10","Class 11","Class 12"];
const opts=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
let nid=100,AUTH=false,cur="dash",AF={op:"all",v:75};
const INFO={name:"Tuition Sir Classes",tag:"Classes 8 to 12 · Maths and Science",about:"Small batches, daily homework checks and a test every week. Parents get attendance and reports directly on WhatsApp.",addr:"Plot no. __, Main Road, Your Area, City",phone:"919800000000",time:"Mon to Sat, 4 PM to 8 PM",years:"10+",batch:"24",photo:""};
const TCH=[{id:1,n:"Rajesh Sharma",q:"M.Sc. Maths, B.Ed.",s:"Maths, Classes 9 to 12",e:"10 years of experience",p:""},{id:2,n:"Priya Verma",q:"M.Sc. Physics",s:"Science, Classes 8 to 10",e:"6 years of experience",p:""}];
const ST=[{id:1,n:"Aarav Sharma",par:"Mr. Sharma",ph:"919800000001",cls:"Class 10",sub:"Maths",fee:3500,due:12,paid:false,p:23,a:2,today:"",marks:42,note:"Algebra strong."},
{id:2,n:"Diya Khanna",par:"Mrs. Khanna",ph:"919800000002",cls:"Class 9",sub:"Science",fee:3000,due:9,paid:false,p:22,a:3,today:"",marks:35,note:""},
{id:3,n:"Rohan Verma",par:"Mr. Verma",ph:"919800000003",cls:"Class 12",sub:"Physics",fee:4500,due:5,paid:false,p:24,a:1,today:"",marks:44,note:""},
{id:4,n:"Meera Patel",par:"Mrs. Patel",ph:"919800000004",cls:"Class 10",sub:"Maths",fee:3500,due:3,paid:false,p:20,a:5,today:"",marks:31,note:"Needs focus on geometry."}];
const ENQ=[{id:1,n:"Neha Bansal",par:"Mrs. Bansal",ph:"919800000010",cls:"Class 9",sub:"Science",msg:"What are the fees?",t:"9:40 AM",st:"new"},{id:2,n:"Yash Kapoor",par:"Mr. Kapoor",ph:"919800000011",cls:"Class 10",sub:"Maths",msg:"Can we get a demo class?",t:"Yesterday",st:"new"}];
const tot=s=>s.p+s.a+(s.today?1:0),pc=s=>tot(s)?Math.round((s.p+(s.today==="P"?1:0))/tot(s)*100):0,ab=s=>s.a+(s.today==="A"?1:0);
const toast=m=>{const t=$$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1900)};
const show=(id,on)=>{$$(id).classList.toggle("on",!!on);const lk=!!document.querySelector(".ov.on,.sb.on");document.body.style.overflow=lk?"hidden":"";document.documentElement.style.overflow=lk?"hidden":""};
const wa=(ph,m)=>window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(m),"_blank");
function confirmBox(msg,yes,btn="Yes, remove",note="You can restore it from a backup."){window.__y=yes;$$("cc").innerHTML=`<h3 style="margin:0 0 6px;font-size:17px">${msg}</h3><p style="color:var(--mute);margin:0 0 14px;font-size:14px">${note}</p><div style="display:flex;gap:8px"><button class="btn ln" onclick="show('conf',0)">No</button><button class="btn rm" onclick="show('conf',0);window.__y()">${btn}</button></div>`;show("conf",1)}
function openSheet(h){$$("sc").innerHTML=h;show("sheet",1)}function closeSheet(){show("sheet",0);render()}

/* ---------- Public site ---------- */
function renderSite(){persist();$$("site").innerHTML=`
<header class="top"><div class="wrap nb"><div class="logo"><i>${esc(ini(INFO.name))}</i><b>${esc(INFO.name)}</b></div><nav class="links"><a href="#about">About</a><a href="#teachers">Teachers</a><a href="#admission">Admission</a></nav><button class="lg" onclick="openLogin()">Teacher login</button></div></header>
<section class="hero"><div class="wrap hg"><div><h1>Learning you understand. Results you can see.</h1><p>${esc(INFO.tag)}. ${esc(INFO.about)}</p><a class="cta g" href="#admission">Fill the admission form</a><a class="cta o" href="#admission">View address</a></div>
<div class="hp">${INFO.photo?`<img src="${INFO.photo}" alt="Coaching">`:`<div class="st"><div><b>${TCH.length}</b><span>teachers</span></div><div><b>${esc(INFO.years)}</b><span>years of experience</span></div><div><b>${esc(INFO.batch)}</b><span>batch size</span></div></div>`}</div></div></section>
<section class="s" id="about"><div class="wrap"><h2 class="t">About us</h2><p class="sub">Personal attention for every student, and a progress report every week.</p><div class="g3"><div class="card"><h4>Small batches</h4><p>Fewer students, so every doubt is cleared in class.</p></div><div class="card"><h4>Daily homework check</h4><p>Homework is checked every day and parents stay informed.</p></div><div class="card"><h4>Weekly test</h4><p>A test every week, with rank and the teacher’s note.</p></div></div></div></section>
<section class="s" id="teachers" style="padding-top:0"><div class="wrap"><h2 class="t">Our teachers</h2><p class="sub">Experienced and caring teachers.</p><div class="g3">${TCH.map(t=>`<div class="card tcard"><div class="tav">${t.p?`<img src="${t.p}" alt="${esc(t.n)}">`:esc(ini(t.n))}</div><div><h4 style="margin:0">${esc(t.n)}</h4><p>${esc(t.q)}</p><p>${esc(t.s)}</p><span class="tag paid">${esc(t.e)}</span></div></div>`).join("")}</div></div></section>
<section class="s" id="admission" style="padding-top:0"><div class="wrap two"><div><h2 class="t">Admission</h2><p class="sub">Fill in the form and we will contact you on WhatsApp.</p><div class="card"><h4>Address</h4><p>${esc(INFO.addr)}</p><p style="margin-top:6px">${esc(INFO.time)}</p><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" style="flex:1" onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(INFO.addr),'_blank')">View on map</button><button class="btn wa" style="flex:1" onclick="location.href='tel:+'+INFO.phone">Call us</button></div></div></div>
<div class="card"><input class="f" id="a-n" placeholder="Student name"><input class="f" id="a-p" placeholder="Parent name"><input class="f" id="a-m" type="tel" placeholder="Mobile number"><select class="f" id="a-c">${opts(CL,"Class 10")}</select><input class="f" id="a-s" placeholder="Subject (e.g. Maths)"><textarea class="f" id="a-x" rows="2" placeholder="Any question or message"></textarea><button class="btn wa" onclick="admit()">Apply for admission</button></div></div></section>
<footer>${esc(INFO.name)} · ${esc(INFO.time)}</footer>`}
function admit(){const g=i=>$$(i).value.trim();if(!g("a-n")||!g("a-m")){toast("Please enter the student name and mobile number");return}
const e={id:++nid,n:g("a-n"),par:g("a-p"),ph:g("a-m").replace(/\D/g,""),cls:g("a-c"),sub:g("a-s"),msg:g("a-x"),t:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),st:"new"};
ENQ.unshift(e);wa(INFO.phone,`Admission enquiry\nStudent: ${e.n}\nParent: ${e.par}\nMobile: ${e.ph}\n${e.cls}, ${e.sub}\n${e.msg}`);toast("Enquiry sent");renderSite();render()}

/* ---------- Login ---------- */
function openLogin(){if(AUTH){show("app",1);return}$$("pin").value="";$$("err").textContent="";show("login",1);setTimeout(()=>$$("pin").focus(),50)}
function doLogin(){if($$("pin").value===PIN){AUTH=true;show("login",0);show("app",1);cur="dash";render()}else $$("err").textContent="Incorrect PIN. Please try again."}
function logout(){AUTH=false;show("app",0)}

/* ---------- Teacher app ---------- */
const sumF=a=>a.reduce((x,s)=>x+Number(s.fee),0),newN=()=>ENQ.filter(e=>e.st==="new").length;
const ftag=s=>s.paid?`<span class="tag paid">Paid</span>`:`<span class="tag ${s.due>=7?"late":"soon"}">${s.due} days late</span>`;
const ptag=s=>`<span class="tag ${pc(s)<75?"late":pc(s)<85?"soon":"paid"}">${pc(s)}%</span>`;
function dash(){const pend=ST.filter(s=>!s.paid),coll=148000+sumF(ST.filter(s=>s.paid)),tp=coll+sumF(pend),pcn=Math.round(coll/tp*100),avg=ST.length?Math.round(ST.reduce((x,s)=>x+pc(s),0)/ST.length):0;
return `<div class="hero2"><small>Fees collected</small><h1>${inr(coll)}</h1><small>${pcn}% collected · ${inr(sumF(pend))} pending</small><div class="prog"><i style="width:${pcn}%"></i></div></div>
<div class="grid"><div class="card" onclick="cur='stu';render()" style="cursor:pointer"><b>${ST.length}</b><small>students ›</small></div><div class="card"><b>${avg}%</b><small>avg attendance</small></div><div class="card" onclick="cur='enq';render()"><b>${newN()}</b><small>new enquiries</small></div></div><div class="row c" onclick="cur='site';render()"><div class="grow"><b>Edit website</b><small>Photo, teachers, address, timing</small></div><span class="tag paid">Open</span></div><div class="row c" onclick="cur='bkp';render()"><div class="grow"><b>Data backup and recovery</b><small>Auto-save, restore, backup file</small></div><span class="tag paid">Open</span></div>`}
function stu(){return`<div class="card" style="padding:0;overflow:hidden;margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line)"><b style="font-size:15px">Student name</b><small style="color:var(--mute)">${ST.length} students · tap a student for details</small></div>`+ST.map(s=>`<div onclick="openProf(${s.id})" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer"><div class="av" style="background:${col(s.id)}">${esc(ini(s.n))}</div><div class="grow"><b style="font-size:14px">${esc(s.n)}</b><small>${esc(s.cls)} · ${esc(s.sub)}</small></div><div class="amt">${inr(s.fee)}<br>${ftag(s)}</div></div>`).join("")+`</div><button class="btn" onclick="editStu(0)">+ Add student</button>`}
function editStu(id){const s=id?ST.find(x=>x.id===id):{n:"",par:"",ph:"",cls:"Class 10",sub:"",fee:3000,due:0,paid:false,p:0,a:0,marks:0,note:""};const I=(k,l,t="text")=>`<label class="fl">${l}</label><input class="f" id="e-${k}" type="${t}" value="${esc(s[k])}">`;

const KEY="tuitiondesk:v1",BKEY="tuitiondesk:backups",LS=(()=>{try{return window.localStorage}catch(e){return null}})();
const snap=()=>JSON.stringify({v:1,nid,INFO,TCH,ST,ENQ});
function load(s){const d=JSON.parse(s);if(!d||d.v!==1||!Array.isArray(d.ST)||!Array.isArray(d.TCH)||!Array.isArray(d.ENQ)||typeof d.INFO!=="object")throw new Error("bad");nid=Math.max(nid,d.nid||0);Object.assign(INFO,d.INFO);[[TCH,d.TCH],[ST,d.ST],[ENQ,d.ENQ]].forEach(([a,b])=>{a.length=0;a.push(...b)})}
let pt=0,lastSaved="";
function persist(){clearTimeout(pt);pt=setTimeout(()=>{try{if(LS){LS.setItem(KEY,snap());lastSaved=new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}}catch(e){}},400)}
const bks=()=>{try{return JSON.parse(LS.getItem(BKEY)||"[]")}catch(e){return[]}};
function bk(why){try{let a=bks();a.unshift({t:new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}),why,data:snap()});a=a.slice(0,10);while(a.length){try{LS.setItem(BKEY,JSON.stringify(a));return true}catch(e){a.pop()}}}catch(e){}return false}
function shrink(src,cb){const i=new Image();i.onload=()=>{const s=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.78))};i.onerror=()=>cb(src);i.src=src}
const cnt=s=>{try{const d=JSON.parse(s);return `${d.ST.length} students · ${d.TCH.length} teachers · ${d.ENQ.length} enquiries`}catch(e){return ""}};
function bkp(){const L=bks();return `<div class="card" style="margin-bottom:12px"><b>Auto-save is on</b><p style="margin:4px 0 0;font-size:13px">Data is saved as JSON in this browser${lastSaved?" · last saved "+lastSaved:""}. A backup is created automatically before any removal and every 5 minutes (the last 10 are kept).</p></div><button class="btn" onclick="bk('manual backup')?toast('Backup created'):toast('Backup failed');render()">Create backup now</button><button class="btn ln" onclick="dl()">Download backup file</button><label class="btn ln" style="display:block;text-align:center;cursor:pointer">Restore from backup file<input type="file" accept=".json,application/json" style="display:none" onchange="impF(this)"></label><h3>Saved backups (${L.length})</h3>`+(L.map((b,i)=>`<div class="row"><div class="grow"><b>${esc(b.t)}</b><small>${esc(b.why)} · ${cnt(b.data)}</small></div><button class="mini" onclick="askRs(${i})">Restore</button></div>`).join("")||`<div class="card"><p>No backups yet.</p></div>`)}
function askRs(i){const b=bks()[i];if(!b)return;confirmBox(`Restore the backup from ${esc(b.t)}?`,()=>{bk("before restore");try{load(b.data)}catch(e){toast("Backup is corrupted");return}renderSite();render();toast("Data restored")},"Yes, restore","Your current data will be saved as a backup first.")}
function impF(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const s=r.result;try{const d=JSON.parse(s);if(d.v!==1||!Array.isArray(d.ST)||!Array.isArray(d.TCH)||!Array.isArray(d.ENQ))throw 0}catch(e){toast("This is not a valid backup file");return}confirmBox("Restore data from this file?",()=>{bk("before file restore");try{load(s)}catch(e){toast("File is corrupted");return}renderSite();render();toast("Data restored")},"Yes, restore","Your current data will be saved as a backup first.")};r.readAsText(f);inp.value=""}
async function dl(){let D=null;try{D=await claude.use("downloads")}catch(e){}const data=snap(),name="tuitiondesk-backup-"+new Date().toISOString().slice(0,10)+".json";if(D){try{await D.save({filename:name,data});toast("Backup file saved");return}catch(e){if(e&&e.code==="declined")return}}openSheet(`<h3 style="margin:0 0 8px;font-size:18px">Backup (JSON)</h3><p style="font-size:13px;color:var(--mute)">Copy this text and save it in a .json file.</p><textarea class="f" rows="10" readonly onclick="this.select()">${esc(data)}</textarea><button class="btn ln" onclick="closeSheet()">Close</button>`)}
try{const s=LS&&LS.getItem(KEY);if(s)load(s)}catch(e){}
setInterval(()=>{const b=bks();if(!b[0]||b[0].data!==snap())bk("auto backup")},300000);
const SEEDT={1:[30,34,33,38,40,42]};ST.forEach(s=>{if(!s.tests)s.tests=(SEEDT[s.id]||(s.marks>0?[s.marks-8,s.marks-4,s.marks].map(x=>Math.max(x,0)):[])).map((m,i)=>({n:"Test "+(i+1),d:"",m,max:50}))});
renderSite();
</script>
</body>
</html>
